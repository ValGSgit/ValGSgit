name: Deploy Static Site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create deployment directory
        run: |
          mkdir -p _deploy
          # Copy only the files we want to deploy (exclude Jekyll structure)
          cp -r assets _deploy/
          cp -r profile-3d-contrib _deploy/ || true
          cp index.html _deploy/
          cp about.html _deploy/
          cp cv.html _deploy/
          cp .nojekyll _deploy/
          # Copy any other HTML files in root
          find . -maxdepth 1 -name "*.html" -not -name "index.html" -not -name "about.html" -not -name "cv.html" -exec cp {} _deploy/ \;
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
